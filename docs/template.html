<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$pagetitle$</title>
<meta name="description" content="What evals showed about helping Claude Code find the right skill among hundreds, and what did not matter.">
<style>
:root{--bg:#ffffff;--text:#161920;--dim:#5f6675;--line:#e2e5ec;--accent:#2f5fd0;--soft:#f4f6fa;--code:#f1f3f8}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--text:#f2f4f8;--dim:#9aa2b1;--line:#262b36;--accent:#7aa2f0;--soft:#161a22;--code:#171b24}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.65 ui-sans-serif,"Avenir Next","Segoe UI",system-ui,sans-serif}
main{max-width:44rem;margin:0 auto;padding:40px 16px 72px;overflow-wrap:anywhere}
h1{font-size:2.1rem;line-height:1.15;margin:0 0 1.1rem;letter-spacing:-.01em}
h1::before{content:"skill-finder · evals";display:block;font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:.6rem}
h1+p{font-size:1.14rem;line-height:1.6}
img{display:block;width:100%;max-width:520px;height:auto;margin:1.4rem 0}
h2{font-size:1.25rem;line-height:1.3;margin:2.4rem 0 .6rem;padding-top:.4rem;border-top:1px solid var(--line)}
p,li{margin:.7rem 0}
ul{padding-left:1.3rem}
a{color:var(--accent)}
table{border-collapse:collapse;width:100%;margin:1.1rem 0;font-size:.95rem;display:block;overflow-x:auto}
th,td{border-bottom:1px solid var(--line);padding:.5rem .7rem;text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:600}
td:not(:first-child),th:not(:first-child){white-space:nowrap}
code{font:.88em ui-monospace,"SF Mono",Menlo,monospace;background:var(--code);padding:.1em .3em;border-radius:4px}
pre{position:relative;background:var(--code);padding:38px 16px 14px;border-radius:8px;border-left:4px solid var(--accent);overflow-x:auto;font-size:.82rem;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.copy{position:absolute;top:8px;right:8px;font:600 .75rem ui-sans-serif,system-ui,sans-serif;color:var(--accent);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer}
.copy:hover{border-color:var(--accent)}
pre code{background:none;padding:0}
footer{margin-top:3rem;padding-top:1rem;border-top:1px solid var(--line);color:var(--dim);font-size:.9rem}
</style>
</head>
<body>
<main>
$body$
<footer>Written by <a href="https://github.com/ydmitry">Dmytro Yaremenko</a>. Part of <a href="https://github.com/ydmitry/skill-finder">skill-finder</a>. Source: <a href="article.md">article.md</a>.</footer>
</main>
<script>
document.querySelectorAll("pre").forEach(function(pre){
  if(!navigator.clipboard)return;
  var b=document.createElement("button");b.className="copy";b.type="button";b.textContent="Copy";
  b.addEventListener("click",function(){navigator.clipboard.writeText(pre.innerText.replace(/\s*Copy$$/,"")).then(function(){b.textContent="Copied";setTimeout(function(){b.textContent="Copy"},1500)})});
  pre.appendChild(b);
});
</script>
</body>
</html>
