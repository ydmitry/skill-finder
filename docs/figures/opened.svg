<svg class="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 448" role="img" aria-label="On Haiku the instruction raised the needed skill opened from 2 to 47 of 58 tasks when installed, and from no route to 44 of 53 when not installed, and local rules followed from 0 to 76 of 144."><title>On Haiku the instruction raised the needed skill opened from 2 to 47 of 58 tasks when installed, and from no route to 44 of 53 when not installed, and local rules followed from 0 to 76 of 144.</title><style>
.fig{--bg:#ffffff;--surface:#f4f6fa;--border:#d5dae4;--text:#161920;--dim:#5f6675;--track:#e6e9f0;--accent:#2f5fd0;--onacc:#ffffff;--muted:#9aa3b5}
@media (prefers-color-scheme: dark){.fig{--bg:#0e1116;--surface:#171b24;--border:#2c3240;--text:#f2f4f8;--dim:#9aa2b1;--track:#262b36;--accent:#7aa2f0;--onacc:#0e1116;--muted:#566077}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--text)}
.dim{fill:var(--dim)} .b{font-weight:700} .tag{fill:var(--dim);font-weight:700;letter-spacing:.07em} .frame{fill:var(--bg);stroke:var(--border)} .trk{fill:var(--track)}
.f-acc{fill:var(--accent)} .f-mut{fill:var(--muted)} .f-out{fill:var(--accent);fill-opacity:.16;stroke:var(--accent);stroke-width:2}
.box{fill:var(--surface);stroke:var(--border)} .hl{fill:var(--accent);stroke:var(--accent)} .hlt{fill:var(--onacc)} .res{fill:var(--bg);stroke:var(--accent);stroke-width:2} .resm{fill:var(--bg);stroke:var(--muted);stroke-width:2}
.arr{stroke:var(--dim);fill:none;stroke-width:1.6} .ah{fill:var(--dim)}
</style><rect class="frame" x=".5" y=".5" width="419" height="447" rx="10"/><text class="tag" x="20" y="28" font-size="12">HAIKU</text><text class="dim" x="20" y="48" font-size="13">Bar length = share of each total.</text><text class="b" x="20" y="78" font-size="15">Needed skill opened, skill installed</text><text class="dim" x="20" y="102" font-size="14">No instruction</text><rect class="trk" x="20" y="108" width="290" height="16" rx="4"/><rect class="f-mut" x="20" y="108" width="10.0" height="16" rx="4"/><text class="b" x="320" y="121" font-size="14">2 of 58</text><text class="dim" x="20" y="146" font-size="14">With the instruction</text><rect class="trk" x="20" y="152" width="290" height="16" rx="4"/><rect class="f-acc" x="20" y="152" width="235.0" height="16" rx="4"/><text class="b" x="320" y="165" font-size="14">47 of 58</text><text class="b" x="20" y="204" font-size="15">Needed skill opened, not installed</text><text class="dim" x="20" y="228" font-size="14">No instruction</text><rect class="trk" x="20" y="234" width="290" height="16" rx="4" fill-opacity=".5"/><text class="dim" x="28" y="246" font-size="12">no route to those skills: not a measurement</text><text class="dim" x="20" y="272" font-size="14">With the instruction</text><rect class="trk" x="20" y="278" width="290" height="16" rx="4"/><rect class="f-acc" x="20" y="278" width="240.8" height="16" rx="4"/><text class="b" x="320" y="291" font-size="14">44 of 53</text><text class="b" x="20" y="330" font-size="15">Local rules followed (24 tasks, 2 runs)</text><text class="dim" x="20" y="354" font-size="14">No instruction</text><rect class="trk" x="20" y="360" width="290" height="16" rx="4"/><text class="b" x="320" y="373" font-size="14">0 of 144</text><text class="dim" x="20" y="398" font-size="14">With the instruction</text><rect class="trk" x="20" y="404" width="290" height="16" rx="4"/><rect class="f-acc" x="20" y="404" width="153.1" height="16" rx="4"/><text class="b" x="320" y="417" font-size="14">76 of 144</text></svg>
