<svg class="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 298" role="img" aria-label="On Sonnet with 897 skills, local rules followed went from 0 of 144 with no instruction to 75 with a plain sentence, 78 with a lookup step and 101 with look-again; the gaps among the three instructions were not shown in this test."><title>On Sonnet with 897 skills, local rules followed went from 0 of 144 with no instruction to 75 with a plain sentence, 78 with a lookup step and 101 with look-again; the gaps among the three instructions were not shown in this test.</title><style>
.fig{--bg:#ffffff;--surface:#f4f6fa;--border:#d5dae4;--text:#161920;--dim:#5f6675;--track:#e6e9f0;--accent:#2f5fd0;--onacc:#ffffff;--muted:#9aa3b5}
@media (prefers-color-scheme: dark){.fig{--bg:#0e1116;--surface:#171b24;--border:#2c3240;--text:#f2f4f8;--dim:#9aa2b1;--track:#262b36;--accent:#7aa2f0;--onacc:#0e1116;--muted:#566077}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--text)}
.dim{fill:var(--dim)} .b{font-weight:700} .tag{fill:var(--dim);font-weight:700;letter-spacing:.07em} .frame{fill:var(--bg);stroke:var(--border)} .trk{fill:var(--track)}
.f-acc{fill:var(--accent)} .f-mut{fill:var(--muted)} .f-out{fill:var(--accent);fill-opacity:.16;stroke:var(--accent);stroke-width:2}
.box{fill:var(--surface);stroke:var(--border)} .hl{fill:var(--accent);stroke:var(--accent)} .hlt{fill:var(--onacc)} .res{fill:var(--bg);stroke:var(--accent);stroke-width:2} .resm{fill:var(--bg);stroke:var(--muted);stroke-width:2}
.arr{stroke:var(--dim);fill:none;stroke-width:1.6} .ah{fill:var(--dim)}
</style><rect class="frame" x=".5" y=".5" width="419" height="297" rx="10"/><text class="tag" x="20" y="28" font-size="12">SONNET · 897 SKILLS · LOCAL RULES FOLLOWED</text><text class="dim" x="20" y="74" font-size="14">No instruction</text><rect class="trk" x="20" y="80" width="290" height="16" rx="4"/><text class="b" x="320" y="93" font-size="14">0 of 144</text><text class="dim" x="20" y="118" font-size="14">Plain sentence: use the team's skills that fit</text><rect class="trk" x="20" y="124" width="290" height="16" rx="4"/><rect class="f-acc" x="20" y="124" width="151.0" height="16" rx="4"/><text class="b" x="320" y="137" font-size="14">75 of 144</text><text class="dim" x="20" y="162" font-size="14">Lookup step (the test's own wording)</text><rect class="trk" x="20" y="168" width="290" height="16" rx="4"/><rect class="f-acc" x="20" y="168" width="157.1" height="16" rx="4"/><text class="b" x="320" y="181" font-size="14">78 of 144</text><text class="dim" x="20" y="206" font-size="14">Lookup step, then look again after each file</text><rect class="trk" x="20" y="212" width="290" height="16" rx="4"/><rect class="f-acc" x="20" y="212" width="203.4" height="16" rx="4"/><text class="b" x="320" y="225" font-size="14">101 of 144</text><text class="dim" x="20" y="246" font-size="12.5">Plain sentence against lookup step: no difference shown.</text><text class="dim" x="20" y="263" font-size="12.5">Look again led only in counts here; see the text.</text></svg>
