n: nothing points to it</text><path class="arr-a" d="M22 172 H44"/><text class="dim" x="52.0" y="176.0" font-size="12.5">by the rule's own words: a search finds it</text><rect class="card sh" x="12.0" y="192.0" width="396.0" height="112.0" rx="12"/><text class="b" x="26.0" y="218.0" font-size="13.5">Sonnet, rule followed</text><text class="dim" x="26.0" y="243.0" font-size="12.5">plain</text><rect class="trk" x="90.0" y="232.0" width="230.0" height="13.0" rx="4"/><text class="b" x="394.0" y="243.0" font-size="12.5" text-anchor="end">0 of 16</text><text class="dim" x="26.0" y="265.0" font-size="12.5">told</text><rect class="trk" x="90.0" y="254.0" width="230.0" height="13.0" rx="4"/><text class="b" x="394.0" y="265.0" font-size="12.5" text-anchor="end">0 of 16</text><text class="dim" x="26.0" y="287.0" font-size="12.5">finder</text><rect class="trk" x="90.0" y="276.0" width="230.0" height="13.0" rx="4"/><rect class="f-grad" x="90.0" y="276.0" width="230.0" height="13.0" rx="4"/><text class="b" x="394.0" y="287.0" font-size="12.5" text-anchor="end">16 of 16</text><rect class="card sh" x="12.0" y="314.0" width="396.0" height="112.0" rx="12"/><text class="b" x="26.0" y="340.0" font-size="13.5">Haiku, rule followed</text><text class="dim" x="26.0" y="365.0" font-size="12.5">plain</text><rect class="trk" x="90.0" y="354.0" width="230.0" height="13.0" rx="4"/><text class="b" x="394.0" y="365.0" font-size="12.5" text-anchor="end">0 of 16</text><text class="dim" x="26.0" y="387.0" font-size="12.5">told</text><rect class="trk" x="90.0" y="376.0" width="230.0" height="13.0" rx="4"/><rect class="f-soft" x="90.0" y="376.0" width="28.8" height="13.0" rx="4"/><text class="b" x="394.0" y="387.0" font-size="12.5" text-anchor="end">2 of 16</text><text class="dim" x="26.0" y="409.0" font-size="12.5">finder</text><rect class="trk" x="90.0" y="398.0" width="230.0" height="13.0" rx="4"/><rect class="f-grad" x="90.0" y="398.0" width="215.6" height="13.0" rx="4"/><text class="b" x="394.0" y="409.0" font-size="12.5" text-anchor="end">15 of 16</text><rect class="card sh" x="12.0" y="436.0" width="396.0" height="112.0" rx="12"/><text class="b" x="26.0" y="462.0" font-size="13.5">Harder rerun: long skills, Sonnet</text><text class="dim" x="26.0" y="487.0" font-size="12.5">told</text><rect class="trk" x="210.0" y="476.0" width="110.0" height="13.0" rx="4"/><text class="b" x="394.0" y="487.0" font-size="12.5" text-anchor="end">0 of 20</text><text class="dim" x="26.0" y="509.0" font-size="12.5">finder</text><rect class="trk" x="210.0" y="498.0" width="110.0" height="13.0" rx="4"/><rect class="f-grad" x="210.0" y="498.0" width="110.0" height="13.0" rx="4"/><text class="b" x="394.0" y="509.0" font-size="12.5" text-anchor="end">20 of 20</text><text class="dim" x="26.0" y="531.0" font-size="12.5">finder, files with plain names</text><rect class="trk" x="210.0" y="520.0" width="110.0" height="13.0" rx="4"/><rect class="f-grad" x="210.0" y="520.0" width="82.5" height="13.0" rx="4"/><text class="b" x="394.0" y="531.0" font-size="12.5" text-anchor="end">15 of 20</text><text class="dim" x="20.0" y="572.0" font-size="12.5">plain = no instruction. told = an instruction to check the</text><text class="dim" x="20.0" y="589.0" font-size="12.5">skills, with no command. finder = the same, with the finder.</text></svg>
