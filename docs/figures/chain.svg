<svg class="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 471" role="img" aria-label="With the instruction and the finder at 897 skills, Claude looked up again after reading a skill in 42 of 48 runs on Haiku, 31 of 48 on Sonnet and 9 of 10 on Opus, and followed the rule that only the first skill points to in 21 of 48, 35 of 48 and 8 of 10."><title>With the instruction and the finder at 897 skills, Claude looked up again after reading a skill in 42 of 48 runs on Haiku, 31 of 48 on Sonnet and 9 of 10 on Opus, and followed the rule that only the first skill points to in 21 of 48, 35 of 48 and 8 of 10.</title><style>
.fig{--bg:#ffffff;--surface:#f6f8fc;--border:#d5dae4;--text:#161920;--dim:#5f6675;--track:#e6e9f0;--accent:#2f5fd0;--accent2:#6f9bf0;--tint:#eaf0fd;--onacc:#ffffff;--muted:#9aa3b5;--warn:#b7791f;--bad:#b4483c;--shadow:.10}
@media (prefers-color-scheme: dark){.fig{--bg:#0e1116;--surface:#161a23;--border:#2c3240;--text:#f2f4f8;--dim:#9aa2b1;--track:#262b36;--accent:#7aa2f0;--accent2:#4f7bd6;--tint:#18233a;--onacc:#0e1116;--muted:#566077;--warn:#d6a03c;--bad:#dd7466;--shadow:.45}}
