.dim{fill:var(--dim)} .b{font-weight:700} .big{font-weight:800} .tag{fill:var(--dim);font-weight:700;letter-spacing:.07em} .on{fill:var(--onacc);font-weight:700}
.frame{fill:var(--bg);stroke:var(--border)} .trk{fill:var(--track)}
.card{fill:var(--surface);stroke:var(--border)} .card-a{fill:var(--tint);stroke:var(--accent);stroke-width:1.5} .card-d{fill:none;stroke:var(--muted);stroke-dasharray:5 4}
.chip{fill:var(--bg);stroke:var(--border)} .chip-a{fill:var(--accent);stroke:var(--accent)} .chip-m{fill:var(--bg);stroke:var(--muted);stroke-dasharray:4 3}
.f-acc{fill:var(--accent)} .f-soft{fill:var(--accent);fill-opacity:.5} .f-mut{fill:var(--muted)} .f-grad{fill:url(#ga)} .f-gv{fill:url(#gv)} .f-comet{fill:url(#gc)}
.s0{stop-color:var(--accent2)} .s1{stop-color:var(--accent)} .c0{stop-color:var(--accent);stop-opacity:.10} .c1{stop-color:var(--accent);stop-opacity:1}
.d-on{fill:var(--accent)} .d-off{fill:var(--track)} .d-mut{fill:var(--muted)} .d-warn{fill:var(--warn)} .d-bad{fill:var(--bad)}
.ring{fill:none;stroke:var(--accent);stroke-width:1.6} .halo{fill:var(--accent);stroke:var(--bg);stroke-width:1.5} .hollow{fill:var(--bg);stroke:var(--muted);stroke-width:2}
.thr{stroke:var(--text);stroke-width:1.5;stroke-dasharray:4 3;fill:none} .zero{stroke:var(--dim);stroke-width:1.4;fill:none}
.arr{stroke:var(--dim);fill:none;stroke-width:1.6} .arr-a{stroke:var(--accent);fill:none;stroke-width:1.6} .lead{stroke:var(--accent);fill:none;stroke-width:1.4;stroke-opacity:.75}
.ah{fill:var(--dim)} .ah-a{fill:var(--accent)} .doc{fill:var(--bg);stroke:var(--accent);stroke-width:1.5} .doc-d{fill:var(--bg);stroke:var(--muted);stroke-width:1.5;stroke-dasharray:3 3} .ln{stroke:var(--muted);stroke-width:1.5}
.sh{filter:url(#sh)}
