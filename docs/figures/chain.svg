xt class="dim" x="26.0" y="324.0" font-size="13">Haiku</text><rect class="trk" x="86.0" y="317.0" width="196.0" height="4.0" rx="2"/><rect class="f-comet" x="86.0" y="315.0" width="85.8" height="8.0" rx="4"/><circle class="hollow" cx="86" cy="319" r="4.5"/><circle class="halo" cx="171.8" cy="319" r="6.5"/><text class="b" x="394.0" y="324.0" font-size="12.5" text-anchor="end">0 → 21 of 48</text><text class="dim" x="26.0" y="350.0" font-size="13">Sonnet</text><rect class="trk" x="86.0" y="343.0" width="196.0" height="4.0" rx="2"/><rect class="f-comet" x="86.0" y="341.0" width="142.9" height="8.0" rx="4"/><circle class="hollow" cx="86" cy="345" r="4.5"/><circle class="halo" cx="228.9" cy="345" r="6.5"/><text class="b" x="394.0" y="350.0" font-size="12.5" text-anchor="end">0 → 35 of 48</text><text class="dim" x="26.0" y="376.0" font-size="13">Opus*</text><rect class="trk" x="86.0" y="369.0" width="196.0" height="4.0" rx="2"/><rect class="f-comet" x="86.0" y="367.0" width="156.8" height="8.0" rx="4"/><circle class="hollow" cx="86" cy="371" r="4.5"/><circle class="halo" cx="242.8" cy="371" r="6.5"/><text class="b" x="394.0" y="376.0" font-size="12.5" text-anchor="end">0 → 8 of 10</text><circle class="hollow" cx="27" cy="412" r="4.5"/><text class="dim" x="40.0" y="416.0" font-size="12.5">no instruction</text><circle class="d-on" cx="160" cy="412" r="6"/><text class="dim" x="174.0" y="416.0" font-size="12.5">instruction + finder</text><text class="dim" x="20.0" y="438.0" font-size="12.5">897 skills. With no instruction no skill was opened at all.</text><text class="dim" x="20.0" y="455.0" font-size="12.5">* Opus: a sample of ten tasks, one run each.</text></svg>
