<svg class="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 485" role="img" aria-label="On Sonnet, a rule in a reference file was followed in 9, 12 and 12 of 12 cases (no instruction, told to check the skills, with the finder) when SKILL.md names the file with a condition; in 0, 10 and 17 of 18 when SKILL.md only says more files exist; and in 0, 4 and 18 of 18 when SKILL.md does not mention the file."><title>On Sonnet, a rule in a reference file was followed in 9, 12 and 12 of 12 cases (no instruction, told to check the skills, with the finder) when SKILL.md names the file with a condition; in 0, 10 and 17 of 18 when SKILL.md only says more files exist; and in 0, 4 and 18 of 18 when SKILL.md does not mention the file.</title><style>
