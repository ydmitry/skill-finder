<svg class="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 487" role="img" aria-label="On Haiku the same instruction with a plain grep scored within 2 to 3 points of the finder on local rules and installed skills, and 13 points lower on not-installed skills, a gap that did not meet the 15-point rule."><title>On Haiku the same instruction with a plain grep scored within 2 to 3 points of the finder on local rules and installed skills, and 13 points lower on not-installed skills, a gap that did not meet the 15-point rule.</title><style>
