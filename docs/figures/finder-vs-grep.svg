</style><rect class="frame" x=".5" y=".5" width="419" height="486" rx="10"/><text class="tag" x="20" y="28" font-size="12">HAIKU · SAME INSTRUCTION, FINDER OR GREP</text><text class="b" x="20" y="58" font-size="15">Local rules followed</text><text class="dim" x="20" y="82" font-size="14">With the finder</text><rect class="trk" x="20" y="88" width="290" height="16" rx="4"/><rect class="f-acc" x="20" y="88" width="153.1" height="16" rx="4"/><text class="b" x="320" y="101" font-size="14">76 of 144</text><text class="dim" x="20" y="126" font-size="14">With grep</text><rect class="trk" x="20" y="132" width="290" height="16" rx="4"/><rect class="f-out" x="21" y="133" width="147.0" height="14" rx="4"/><text class="b" x="320" y="145" font-size="14">74 of 144</text><text class="b" x="20" y="184" font-size="15">Needed skill opened, installed</text><text class="dim" x="20" y="208" font-size="14">With the finder</text><rect class="trk" x="20" y="214" width="290" height="16" rx="4"/><rect class="f-acc" x="20" y="214" width="235.0" height="16" rx="4"/><text class="b" x="320" y="227" font-size="14">47 of 58</text><text class="dim" x="20" y="252" font-size="14">With grep</text><rect class="trk" x="20" y="258" width="290" height="16" rx="4"/><rect class="f-out" x="21" y="259" width="223.0" height="14" rx="4"/><text class="b" x="320" y="271" font-size="14">45 of 58</text><text class="b" x="20" y="310" font-size="15">Needed skill opened, not installed</text><text class="dim" x="20" y="334" font-size="14">With the finder</text><rect class="trk" x="20" y="340" width="290" height="16" rx="4"/><rect class="f-acc" x="20" y="340" width="240.8" height="16" rx="4"/><text class="b" x="320" y="353" font-size="14">44 of 53</text><text class="dim" x="20" y="378" font-size="14">With grep</text><rect class="trk" x="20" y="384" width="290" height="16" rx="4"/><rect class="f-out" x="21" y="385" width="200.5" height="14" rx="4"/><text class="b" x="320" y="397" font-size="14">37 of 53</text><text class="dim" x="20" y="418" font-size="12.5">13 points apart: finder ahead in 9 tasks, grep in 2</text><text class="dim" x="20" y="435" font-size="12.5">(p = 0.065). Under the 15-point rule: not shown.</text><text class="dim" x="20" y="469" font-size="12.5">Two runs of one setup differ by a few tasks.</text></svg>
